name: Build Dulz PC Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle*" -o -name "settings.gradle*" \) \
            -print

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "=== APK HASIL BUILD ==="
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dulz-PC-Launcher-2026
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
